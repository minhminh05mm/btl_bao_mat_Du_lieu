name: bmdl
x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile
  image: bmdl-app:local
  working_dir: /project
  volumes:
    - ./app:/project/app:ro
    - ./runtime/shared:/runtime
    - ./runtime/api-secrets:/runtime/secrets:ro
    - ./runtime/pki-public:/runtime/pki:ro
  user: '1000:1000'
  environment: &env
    DATABASE_URL: ${DATABASE_URL}
    OPA_URL: http://opa:8181/v1/data/bmdl/decision
    BAO_ADDR: http://openbao:8200
    BAO_TOKEN_FILE: /runtime/secrets/bao-app-token
    PROXY_SECRET_FILE: /runtime/secrets/proxy-secret
    RUNTIME_DIR: /runtime
    OIDC_ISSUER: https://localhost:9443/realms/bmdl
    OIDC_JWKS_URL: http://keycloak:8080/realms/bmdl/protocol/openid-connect/certs
    OIDC_AUDIENCE: zt-api
    POLICY_MODE: B1
  depends_on:
    - postgres
    - opa
    - openbao
    - keycloak
  networks: [control, data]
  mem_limit: 768m
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bmdl
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-bmdl.sql:ro
    networks: [data]
    mem_limit: 512m
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --import-realm, --http-enabled=true, --proxy-headers=xforwarded, --health-enabled=true]
    environment:
      KC_HOSTNAME: https://localhost:9443
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-root
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_HOST: 0.0.0.0
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
      - kcdata:/opt/keycloak/data
      - ./infra/keycloak-realm.json:/opt/keycloak/data/import/bmdl.json:ro
    networks: [control]
    mem_limit: 1g
    restart: unless-stopped
  opa:
    image: openpolicyagent/opa:1.21.2
    command: [run, --server, --addr=0.0.0.0:8181, --log-level=error, /policies]
    volumes:
      - ./policies:/policies:ro
    networks: [control]
    mem_limit: 256m
    restart: unless-stopped
  openbao:
    image: ghcr.io/openbao/openbao:2.7.1
    command: [server, -config=/bao/config/openbao.hcl]
    volumes:
      - baodata:/bao/data
      - ./infra/openbao.hcl:/bao/config/openbao.hcl:ro
    networks: [data]
    mem_limit: 512m
    restart: unless-stopped
  api:
    <<: *app
  api-baseline:
    <<: *app
    environment:
      <<: *env
      POLICY_MODE: B0
  gateway:
    image: nginx:stable-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime/pki/ca.crt:/runtime/pki/ca.crt:ro
      - ./runtime/pki/server.crt:/runtime/pki/server.crt:ro
      - ./runtime/pki/server.key:/runtime/pki/server.key:ro
    ports:
      - 127.0.0.1:8443:8443
      - 127.0.0.1:8444:8444
      - 127.0.0.1:9443:9443
    networks: [edge, control]
    mem_limit: 128m
    restart: unless-stopped
  lab:
    <<: *app
    command: [uvicorn, lab.web:app, --host, 0.0.0.0, --port, '8088', --no-access-log]
    user: '0:0'
    volumes:
      - .:/project
      - ./runtime:/runtime
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *env
      PROJECT_HOST_PATH: /mnt/e/btl_bao_mat_Du_lieu
      RESTIC_REPOSITORY: /runtime/backups/repository
      RESTIC_PASSWORD_FILE: /runtime/secrets/restic-password
    ports:
      - 127.0.0.1:8088:8088
    mem_limit: 1g
    networks: [edge, control, data]
volumes:
  pgdata:
  baodata:
  kcdata:
networks:
  edge:
  control:
    internal: true
  data:
    internal: true
